name: Build Forge 1.8.9

on:
  workflow_dispatch:
  push:
    paths:
      - 'versions/1.8.9/**'
      - '.github/workflows/build-forge-1.8.9.yml'
  pull_request:
    paths:
      - 'versions/1.8.9/**'
      - '.github/workflows/build-forge-1.8.9.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 1.8.9 (Forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/1.8.9

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build Forge mod
        run: ./gradlew --no-daemon setupDecompWorkspace build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Essential-Patcher-Forge-1.8.9
          path: versions/1.8.9/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
